<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRK YouTube loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Loops the public @srk_honda uploads playlist with sound. Shown by the SRK Office Display
     TV app (LG webOS) inside an iframe. Holds no secrets — public channel only. -->
<div id="p"></div>
<script>
  var PLAYLIST = 'UU6aD7kCwr4peQndI0zG7V7Q'; // @srk_honda uploads = EVERY upload, auto-updating
  var REFRESH_HOURS = 3;                     // re-fetch the list so new uploads appear / removed drop
  var player, tries = 0;

  function unmute() {
    if (!player || !player.unMute) return;
    player.setVolume(100);
    player.unMute();
    setTimeout(function () {
      if (player.isMuted && player.isMuted() && tries++ < 6) unmute();
    }, 800);
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('p', {
      host: 'https://www.youtube.com',
      playerVars: {
        listType: 'playlist', list: PLAYLIST,
        autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, mute: 1, loop: 1
      },
      events: {
        onReady: function (e) {
          e.target.setLoop(true); e.target.playVideo(); unmute();
          // periodically re-fetch the uploads playlist: picks up new uploads, drops removed ones
          setInterval(function () {
            try { player.loadPlaylist({ listType: 'playlist', list: PLAYLIST, index: 0 }); player.setLoop(true); } catch (e) {}
          }, REFRESH_HOURS * 3600 * 1000);
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) unmute();
          if (e.data === YT.PlayerState.ENDED) e.target.playVideo();
        },
        onError: function () { try { player.nextVideo(); } catch (e) {} } // skip a deleted/blocked video
      }
    });
  }

  // the TV app asks for sound with postMessage({srk:'unmute'})
  window.addEventListener('message', function (ev) {
    if (ev.data && ev.data.srk === 'unmute') { tries = 0; unmute(); }
  });

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
</script>
</body>
</html>
